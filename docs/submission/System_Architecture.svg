<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#17365D}
    .team{font:700 18px Arial,sans-serif;fill:#17365D}
    .h{font:700 22px Arial,sans-serif;fill:#111827}
    .sub{font:600 15px Arial,sans-serif;fill:#334155}
    .b{font:700 15px Arial,sans-serif;fill:#111827}
    .t{font:500 14px Arial,sans-serif;fill:#1f2937}
    .s{font:500 12px Arial,sans-serif;fill:#475569}
    .tiny{font:600 11px Arial,sans-serif;fill:#334155}
    .panel{stroke-width:2}
    .wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .wire2{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".15"/>
  </filter>
</defs>

<rect width="1536" height="1024" fill="#ffffff"/>

<!-- Title -->
<rect x="315" y="18" width="910" height="54" rx="18" fill="#ffffff" stroke="#1e4d86" stroke-width="3"/>
