<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<rect width="1600" height="1050" fill="#f7f9fc"/>
<style>
.title{font:700 30px Arial;fill:#17365d}.sub{font:600 17px Arial;fill:#4d5d70}
.h{font:700 20px Arial;fill:#17365d}.t{font:500 15px Arial;fill:#17212b}.b{font:700 15px Arial;fill:#17212b}
.box{stroke:#7890a8;stroke-width:2;rx:16}.line{stroke-width:4;fill:none}
</style>
<rect x="370" y="18" width="860" height="62" rx="18" fill="#fff" stroke="#17365d" stroke-width="3"/>
<text x="800" y="49" text-anchor="middle" class="title">PS4 SEARCH &amp; RESCUE — UAV SYSTEM ARCHITECTURE</text>
<text x="800" y="73" text-anchor="middle" class="sub">TEAM ANOMALY · KT-2047</text>

<rect x="20" y="105" width="365" height="390" class="box" fill="#fff1f1" stroke="#e07070"/>
<text x="40" y="138" class="h">1. POWER SYSTEM</text>
<text x="40" y="165" class="t">11.1 V (3S) propulsion battery + regulated 5 V supply</text>
<text x="55" y="215" class="b">3S LiPo · 11.1 V · 5200 mAh</text>
<text x="55" y="238" class="t">40C continuous / 80C burst</text>
<rect x="55" y="270" width="145" height="48" rx="10" fill="#fff" stroke="#e07070"/>
<text x="127" y="299" text-anchor="middle" class="b">Power Module</text>
<rect x="225" y="270" width="125" height="48" rx="10" fill="#fff" stroke="#e07070"/>
<text x="287" y="299" text-anchor="middle" class="b">F450 PDB</text>
<path d="M200 294H225" class="line" stroke="#e00000"/>
<text x="55" y="355" class="b">5 V / 5 A Buck Converter</text>
<text x="55" y="379" class="t">Regulated supply to Raspberry Pi</text>
<path d="M127 318V350" class="line" stroke="#e00000"/>

<rect x="405" y="105" width="420" height="390" class="box" fill="#eef6ff" stroke="#4b99df"/>
<text x="425" y="138" class="h">2. FLIGHT CONTROL SYSTEM</text>
<text x="425" y="165" class="t">Stabilization, navigation and actuator control</text>
<rect x="520" y="230" width="190" height="110" rx="16" fill="#fff" stroke="#4b99df" stroke-width="2"/>
<text x="615" y="275" text-anchor="middle" class="b">Pixhawk 2.4.8</text>
<text x="615" y="299" text-anchor="middle" class="t">ArduCopter flight control</text>
<text x="440" y="220" class="t">GPS + compass</text>
<text x="440" y="245" class="t">UART / I²C</text>
<text x="735" y="225" class="t">PWM 1–4</text>
<path d="M710 245H790" class="line" stroke="#1675d1"/>
<path d="M710 270H790" class="line" stroke="#1675d1"/>
<path d="M710 295H790" class="line" stroke="#1675d1"/>
<path d="M710 320H790" class="line" stroke="#1675d1"/>
<text x="535" y="390" class="t">TELEM1 → 433 MHz SiK</text>
<text x="535" y="415" class="t">TELEM2 → Raspberry Pi / MAVLink</text>

<rect x="845" y="105" width="350" height="390" class="box" fill="#effbef" stroke="#49a85c"/>
<text x="865" y="138" class="h">3. SENSORS &amp; PERCEPTION</text>
<text x="865" y="165" class="t">RGB, thermal, stereo and navigation state</text>
<rect x="875" y="205" width="285" height="60" rx="10" fill="#fff" stroke="#49a85c"/>
<text x="1017" y="230" text-anchor="middle" class="b">Camera Module 3 · RGB</text>
<text x="1017" y="251" text-anchor="middle" class="t">11.9 MP · IMX708 · CSI-2</text>
<rect x="875" y="285" width="285" height="60" rx="10" fill="#fff" stroke="#d88c35"/>
<text x="1017" y="310" text-anchor="middle" class="b">MLX90640 · Thermal</text>
<text x="1017" y="331" text-anchor="middle" class="t">32 × 24 IR array · I²C</text>
<rect x="875" y="365" width="285" height="60" rx="10" fill="#fff" stroke="#4b79c5"/>
<text x="1017" y="390" text-anchor="middle" class="b">Waveshare AR0144 Stereo</text>
<text x="1017" y="411" text-anchor="middle" class="t">2 MP synchronized · USB/UVC</text>

<rect x="1215" y="105" width="365" height="390" class="box" fill="#f5efff" stroke="#8055c8"/>
<text x="1235" y="138" class="h">4. COMPUTING &amp; ONBOARD AI</text>
<text x="1235" y="165" class="t">Perception, inference, mission logic and local data</text>
<rect x="1255" y="220" width="285" height="95" rx="16" fill="#fff" stroke="#8055c8" stroke-width="2"/>
<text x="1397" y="250" text-anchor="middle" class="b">Raspberry Pi 4 Model B</text>
<text x="1397" y="274" text-anchor="middle" class="t">4 GB RAM</text>
<text x="1397" y="298" text-anchor="middle" class="t">ROS 2 + OpenCV + lightweight AI</text>
<text x="1235" y="350" class="t">• Object detection</text><text x="1235" y="373" class="t">• Thermal processing</text>
<text x="1235" y="396" class="t">• Stereo depth / SLAM</text><text x="1235" y="419" class="t">• Sensor fusion / geo-tagging</text>
<text x="1235" y="442" class="t">• Risk assessment / local storage</text>

<rect x="20" y="525" width="1560" height="180" class="box" fill="#fff7ea" stroke="#e59a28"/>
<text x="40" y="558" class="h">5. PROPULSION SYSTEM</text>
<text x="40" y="585" class="t">Four matched A2212 1000 KV BLDC motors + 30 A SimonK ESCs + 1045 propellers</text>
<g class="b">
<text x="120" y="640">ESC 1</text><text x="480" y="640">ESC 2</text><text x="840" y="640">ESC 3</text><text x="1200" y="640">ESC 4</text>
</g>
<g class="t">
<text x="95" y="670">A2212 · Motor 1</text><text x="455" y="670">A2212 · Motor 2</text><text x="815" y="670">A2212 · Motor 3</text><text x="1175" y="670">A2212 · Motor 4</text>
</g>
<path d="M610 340V525M610 525H120M610 525H480M610 525H840M610 525H1200" class="line" stroke="#e59a28"/>
<text x="105" y="695" class="t">PWM 1</text><text x="465" y="695" class="t">PWM 2</text><text x="825" y="695" class="t">PWM 3</text><text x="1185" y="695" class="t">PWM 4</text>

<rect x="20" y="735" width="500" height="250" class="box" fill="#fff1f1" stroke="#e07070"/>
<text x="40" y="768" class="h">6. GROUND STATION</text>
<text x="40" y="800" class="b">433 MHz SiK ground radio → USB → operator laptop</text>
<text x="40" y="835" class="t">• Mission monitoring</text><text x="40" y="858" class="t">• Map and detections</text>
<text x="40" y="881" class="t">• Mission status</text><text x="40" y="904" class="t">• Alerts and logs</text>

<rect x="540" y="735" width="700" height="250" class="box" fill="#eef6ff" stroke="#4b99df"/>
<text x="560" y="768" class="h">7. HIGH-LEVEL DATA FLOW</text>
<text x="570" y="810" class="t">RGB + Thermal + Stereo + GPS/IMU</text>
<path d="M820 805H900" class="line" stroke="#1675d1"/>
<rect x="900" y="785" width="220" height="100" rx="14" fill="#fff" stroke="#1675d1"/>
<text x="1010" y="815" text-anchor="middle" class="b">Raspberry Pi 4B</text>
<text x="1010" y="838" text-anchor="middle" class="t">Perception + Fusion</text>
<text x="1010" y="861" text-anchor="middle" class="t">Risk + Geo-tagging</text>
<path d="M1120 835H1195" class="line" stroke="#1675d1"/>
<text x="1145" y="820" class="t">Mission data</text>
<text x="1145" y="855" class="t">→ command center</text>

<rect x="1260" y="735" width="320" height="250" class="box" fill="#f8fbff" stroke="#7890a8"/>
<text x="1280" y="768" class="h">8. SYSTEM FEATURES</text>
<text x="1280" y="805" class="t">• Autonomous-navigation architecture</text>
<text x="1280" y="830" class="t">• Multi-sensor perception</text>
<text x="1280" y="855" class="t">• Thermal hotspot detection</text>
<text x="1280" y="880" class="t">• Stereo depth / spatial perception</text>
<text x="1280" y="905" class="t">• Geo-tagging</text>
<text x="1280" y="930" class="t">• Local / offline processing</text>
<text x="1280" y="955" class="t">• Telemetry + command center</text>
</svg>